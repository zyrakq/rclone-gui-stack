services:
  rclone-gui:
    environment:
      RCLONE_ALLOW_ORIGIN_SCHEME: ${RCLONE_ALLOW_ORIGIN_SCHEME}
      RCLONE_ALLOW_ORIGIN_HOST: ${RCLONE_ALLOW_ORIGIN_HOST}
      RCLONE_ALLOW_ORIGIN_PORT: ${RCLONE_ALLOW_ORIGIN_PORT}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
